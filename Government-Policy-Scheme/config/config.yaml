# Government Scheme Discovery AI - Configuration

app:
  name: "Government Scheme Discovery AI"
  version: "0.1.0"
  description: "AI-powered platform to discover and apply for Indian government schemes"

# Embedding Model Configuration
embeddings:
  model_name: "BAAI/bge-m3"
  device: "cpu"  # Change to 'cuda' for GPU
  batch_size: 32
  max_length: 8192
  normalize_embeddings: true

# Vector Database Configuration
vector_db:
  provider: "qdrant"
  collection_name: "government_schemes"
  host: "localhost"
  port: 6333
  vector_size: 1024  # BGE-M3 dimension
  distance_metric: "cosine"
  on_disk: true  # Store vectors on disk for larger datasets

# LLM Configuration
llm:
  provider: "gemini"
  model: "gemini-2.0-flash-exp"
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.95
  timeout: 30
  retry_attempts: 3
  fallback_model: "gemini-1.5-flash"  # Fallback if 2.0 fails

# Retrieval Configuration
retrieval:
  hybrid_search: true
  vector_weight: 0.7  # 70% vector, 30% keyword
  keyword_weight: 0.3
  top_k: 10
  similarity_threshold: 0.65
  rerank: true
  rerank_top_k: 5

# Eligibility Rules Configuration
eligibility:
  strict_mode: false  # If true, all criteria must match
  scoring_method: "weighted"  # or 'boolean'
  min_match_score: 0.6
  boost_factors:
    income: 1.5
    category: 1.3
    state: 1.2
    age: 1.0

# Document Processing
document_processing:
  engine: "docling"
  ocr_enabled: true
  ocr_languages: ["eng", "hin"]
  extract_tables: true
  extract_forms: true
  max_pages: 100
  chunk_size: 512
  chunk_overlap: 50

# User Profile Schema
user_profile_fields:
  - name: "age"
    type: "integer"
    required: true
  - name: "gender"
    type: "select"
    options: ["Male", "Female", "Other"]
    required: true
  - name: "category"
    type: "select"
    options: ["General", "OBC", "SC", "ST", "EWS"]
    required: true
  - name: "annual_income"
    type: "integer"
    required: true
  - name: "state"
    type: "select"
    required: true
  - name: "occupation"
    type: "select"
    options: ["Student", "Farmer", "Business", "Salaried", "Unemployed", "Self-employed", "Retired"]
    required: true
  - name: "education"
    type: "select"
    options: ["Below 10th", "10th Pass", "12th Pass", "Graduate", "Post-graduate", "Professional"]
    required: false
  - name: "marital_status"
    type: "select"
    options: ["Single", "Married", "Divorced", "Widowed"]
    required: false
  - name: "disability"
    type: "boolean"
    required: false
  - name: "bpl_card"
    type: "boolean"
    required: false

# Scheme Categories
scheme_categories:
  - "Education & Scholarships"
  - "Agriculture & Farming"
  - "Business & Entrepreneurship"
  - "Housing & Infrastructure"
  - "Healthcare"
  - "Women Empowerment"
  - "Senior Citizens"
  - "Employment & Skill Development"
  - "Financial Assistance"
  - "Social Welfare"

# Indian States and UTs
states:
  - "Andhra Pradesh"
  - "Arunachal Pradesh"
  - "Assam"
  - "Bihar"
  - "Chhattisgarh"
  - "Goa"
  - "Gujarat"
  - "Haryana"
  - "Himachal Pradesh"
  - "Jharkhand"
  - "Karnataka"
  - "Kerala"
  - "Madhya Pradesh"
  - "Maharashtra"
  - "Manipur"
  - "Meghalaya"
  - "Mizoram"
  - "Nagaland"
  - "Odisha"
  - "Punjab"
  - "Rajasthan"
  - "Sikkim"
  - "Tamil Nadu"
  - "Telangana"
  - "Tripura"
  - "Uttar Pradesh"
  - "Uttarakhand"
  - "West Bengal"
  - "Andaman and Nicobar Islands"
  - "Chandigarh"
  - "Dadra and Nagar Haveli and Daman and Diu"
  - "Delhi"
  - "Jammu and Kashmir"
  - "Ladakh"
  - "Lakshadweep"
  - "Puducherry"

# Logging Configuration
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  rotation: "10 MB"
  retention: "30 days"
  log_file: "logs/app.log"

# UI Configuration
ui:
  theme: "light"
  primary_color: "#FF6B35"
  secondary_color: "#004E89"
  show_metrics: true
  enable_feedback: true
  items_per_page: 10

# Feature Flags
features:
  chat_interface: true
  document_upload: true
  form_auto_fill: false  # Future feature
  application_tracking: false  # Future feature
  notifications: false  # Future feature
  multi_language: false  # Future feature

# Cache Configuration
cache:
  enabled: true
  ttl: 3600  # 1 hour
  max_size: 1000  # Max cached items
